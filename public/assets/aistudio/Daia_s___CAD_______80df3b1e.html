<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daia's３次元ＣＡＤ対策</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cinzel, Playfair Display & Noto Serif JP -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #09070a;
            color: #e6dfd3;
            overflow-x: hidden;
        }
        .classic-title {
            font-family: 'Cinzel', 'Playfair Display', 'Noto Serif JP', serif;
        }
        /* Dark Academia Library Dynamic Background Layers */
        #library-bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.8s ease-in-out, background-image 0.6s ease-in-out;
        }
        #library-bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 35%, rgba(13, 10, 14, 0.58) 0%, rgba(7, 5, 9, 0.88) 100%);
            backdrop-filter: blur(2px);
            pointer-events: none;
        }
        /* Antique Mysterious Dark Card */
        .antique-card {
            background: linear-gradient(145deg, rgba(24, 20, 28, 0.90) 0%, rgba(15, 12, 19, 0.94) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.5);
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(212, 175, 55, 0.2);
            position: relative;
        }
        .antique-card::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(197, 160, 89, 0.18);
            border-radius: inherit;
            pointer-events: none;
        }
        .antique-btn {
            background: linear-gradient(135deg, #3a1c24 0%, #241116 100%);
            color: #f3e5ab;
            border: 1px solid #c5a059;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
        }
        .antique-btn:hover {
            background: linear-gradient(135deg, #522531 0%, #33161e 100%);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.35);
            transform: translateY(-1px);
        }
        .antique-option {
            background-color: rgba(24, 19, 29, 0.88);
            border: 1px solid rgba(197, 160, 89, 0.32);
            color: #dfd7c8;
            transition: all 0.2s ease;
        }
        .antique-option:hover:not(:disabled) {
            background-color: rgba(58, 43, 66, 0.78);
            border-color: #d4af37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.22);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.35s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#722f37] selection:text-[#f3e5ab]">

    <!-- Dark Academia Library Background & Vignette -->
    <div id="library-bg-layer"></div>
    <div id="library-bg-overlay"></div>

    <!-- Header -->
    <header class="bg-[#09070a]/90 backdrop-blur-md text-[#e6dfd3] py-5 px-4 border-b border-[#c5a059]/40 shadow-[0_4px_20px_rgba(0,0,0,0.8)] sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="goToHome()">
                <div class="p-2 rounded-full border border-[#c5a059]/50 bg-[#1a141e] group-hover:border-[#ffd700] transition">
                    <svg class="w-6 h-6 text-[#d4af37]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <div>
                    <span class="block text-[10px] tracking-[0.25em] text-[#c5a059]">Daia's３次元ＣＡＤ対策</span>
                    <h1 class="classic-title text-xl sm:text-2xl font-bold tracking-wider text-[#f3e5ab]">3次元CAD利用技術者試験２級</h1>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="bg-scene-badge" class="hidden md:inline-block text-[11px] px-3 py-1 rounded-full bg-[#17121c]/90 text-[#c5a059] border border-[#c5a059]/30 tracking-wider">
                    🏛️ 書庫情景 1/10
                </span>
                <button id="home-btn-header" onclick="goToHome()" class="hidden text-xs sm:text-sm px-4 py-2 rounded-lg bg-[#1d1722] hover:bg-[#3a1c24] text-[#d4af37] border border-[#c5a059]/50 transition shadow">
                    🗝️ ホームへ戻る
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-3xl w-full mx-auto p-4 sm:p-6 my-6">

        <!-- Custom Message Box (Replaces alert) -->
        <div id="custom-toast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-[#2a151b] border border-[#d4af37] text-[#f3e5ab] px-6 py-3 rounded-xl shadow-2xl text-sm font-semibold animate-fadeIn">
            <span id="custom-toast-msg"></span>
        </div>

        <!-- VIEW 1: HOME (FILE SELECTION) -->
        <div id="view-home" class="space-y-8 animate-fadeIn">
            <div class="text-center space-y-3 mb-8">
                <span class="inline-block text-xs tracking-[0.2em] uppercase px-4 py-1 bg-[#261829] text-[#d4af37] font-semibold rounded-full border border-[#c5a059]/40">
                    ✦ ようこそ ✦
                </span>
                <h2 class="classic-title text-3xl sm:text-4xl font-bold text-[#f3e5ab] drop-shadow">ホーム</h2>
                <p class="text-sm text-[#9e9285]">ファイルを1つお選びください。</p>
            </div>

            <div id="file-list-container" class="grid grid-cols-1 gap-6">
                <!-- Dynamically injected file cards -->
            </div>
        </div>

        <!-- VIEW 2: QUIZ SCREEN -->
        <div id="view-quiz" class="hidden space-y-6 animate-fadeIn">
            <!-- Top Progress Indicator -->
            <div class="bg-[#151118] border border-[#c5a059]/30 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-2 shadow-lg">
                <span id="quiz-file-title" class="font-bold text-[#d4af37] text-sm sm:text-base tracking-wide"></span>
                <div class="flex items-center space-x-3">
                    <span id="quiz-progress-text" class="bg-[#2a1c30] px-4 py-1 rounded-full font-bold text-xs sm:text-sm text-[#f3e5ab] border border-[#c5a059]/60 shadow-inner">
                        第 1 問 / 全 30 問
                    </span>
                </div>
            </div>

            <!-- Question Card -->
            <div class="antique-card rounded-2xl p-6 sm:p-8 space-y-6">
                <!-- Question Number & Text -->
                <div class="space-y-3">
                    <div class="inline-flex items-center space-x-2 text-xs uppercase tracking-widest font-bold text-[#c5a059] bg-[#211926] px-3 py-1 rounded border border-[#c5a059]/40" id="current-q-badge">
                        <span>❖ 問題 1</span>
                    </div>
                    <!-- Diagram Container (Shown only for diagram questions) -->
                    <div id="question-diagram-container" class="hidden my-4 p-3 sm:p-4 bg-[#f8f6f0] rounded-xl border-2 border-[#c5a059]/70 shadow-inner overflow-x-auto">
                    </div>
                    <h3 id="question-text" class="text-lg sm:text-xl font-bold text-[#f5efe6] leading-relaxed">
                        ここに問題文が表示されます。
                    </h3>
                </div>

                <!-- Options List -->
                <div id="options-container" class="space-y-3">
                    <!-- Dynamically injected options -->
                </div>

                <!-- Explanation Box (Shown after answering) -->
                <div id="explanation-box" class="hidden mt-6 p-5 rounded-xl border-l-4 transition-all animate-fadeIn">
                    <div class="flex items-center space-x-2 font-bold mb-2" id="explanation-header">
                        <!-- Correct/Incorrect icon & title -->
                    </div>
                    <div id="explanation-text" class="text-sm sm:text-base leading-relaxed"></div>
                </div>
            </div>

            <!-- Navigation Buttons (Prev / Next) -->
            <div class="flex items-center justify-between pt-2">
                <button onclick="prevQuestion()" id="prev-btn" class="px-5 py-3 rounded-xl border border-[#c5a059]/40 text-[#c9beae] bg-[#1a151f] hover:bg-[#2a2133] hover:text-[#f3e5ab] font-semibold text-sm transition flex items-center space-x-2 shadow">
                    <span>◀ 戻る</span>
                </button>
                <button onclick="nextQuestion()" id="next-btn" class="antique-btn px-7 py-3 rounded-xl font-bold text-sm transition flex items-center space-x-2">
                    <span id="next-btn-text">次へ ▶</span>
                </button>
            </div>
        </div>

        <!-- VIEW 3: RESULT SCREEN -->
        <div id="view-result" class="hidden space-y-6 animate-fadeIn">
            <div class="antique-card rounded-2xl p-8 sm:p-10 text-center space-y-8">
                <div class="space-y-3">
                    <span class="inline-block text-xs uppercase tracking-[0.25em] text-[#d4af37] font-bold px-4 py-1 bg-[#261829] rounded-full border border-[#c5a059]/40">
                        ✦ 試練の記録 ✦
                    </span>
                    <h2 class="classic-title text-3xl sm:text-4xl font-bold text-[#f3e5ab]">最終鑑定結果</h2>
                    <p class="text-sm text-[#a69a8c]" id="result-file-subtitle"></p>
                </div>

                <!-- Score Stats Box -->
                <div class="bg-[#120e16] border border-[#c5a059]/50 rounded-xl p-6 max-w-lg mx-auto grid grid-cols-3 gap-4 shadow-inner">
                    <div class="text-center border-r border-[#c5a059]/25 pr-2">
                        <span class="block text-xs text-[#9e9285] font-semibold mb-1">正解した回数</span>
                        <span id="stat-correct" class="text-2xl sm:text-3xl font-bold text-emerald-400">0</span>
                    </div>
                    <div class="text-center border-r border-[#c5a059]/25 pr-2">
                        <span class="block text-xs text-[#9e9285] font-semibold mb-1">間違えた回数</span>
                        <span id="stat-incorrect" class="text-2xl sm:text-3xl font-bold text-rose-400">0</span>
                    </div>
                    <div class="text-center">
                        <span class="block text-xs text-[#9e9285] font-semibold mb-1">正解率</span>
                        <span id="stat-percentage" class="text-2xl sm:text-3xl font-bold text-[#f3e5ab]">0%</span>
                    </div>
                </div>

                <!-- Action Buttons: Home & Retry -->
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
                    <button onclick="goToHome()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl border border-[#c5a059]/60 bg-[#1c1622] hover:bg-[#2c2236] text-[#e6dfd3] font-bold shadow-lg transition flex items-center justify-center space-x-2">
                        <span>🗝️ ホームに戻る</span>
                    </button>
                    <button onclick="retryQuiz()" class="w-full sm:w-auto antique-btn px-8 py-3.5 rounded-xl font-bold shadow-lg transition flex items-center justify-center space-x-2">
                        <span>🕯️ もう一度挑戦する</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-[#09070a] text-[#6e6359] text-xs py-4 text-center border-t border-[#c5a059]/20">
        <p>Gutta cavat lapidem.</p>
    </footer>

    <!-- Application Script -->
    <script>
        // 10 Dark Academia Library Backgrounds (High-resolution photos + Atmospheric SVG Bookcase Fallbacks)
        const darkAcademiaLibraryScenes = [
            {
                name: "大聖堂の古書回廊",
                url: "https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1920&q=80",
                palette: ["#1c120c", "#3b2316", "#8c6239", "#d4af37"]
            },
            {
                name: "燭台灯る深夜の閲覧室",
                url: "https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1920&q=80",
                palette: ["#141018", "#2d1e2f", "#6b4423", "#c5a059"]
            },
            {
                name: "螺旋階段と天蓋書架",
                url: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1920&q=80",
                palette: ["#161311", "#33261d", "#735338", "#e6c27a"]
            },
            {
                name: "深緑のランプと羊皮紙机",
                url: "https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&w=1920&q=80",
                palette: ["#0d1714", "#1b332b", "#4a3520", "#d4af37"]
            },
            {
                name: "修道院の禁書保管庫",
                url: "https://images.unsplash.com/photo-1568667256549-094345857637?auto=format&fit=crop&w=1920&q=80",
                palette: ["#191114", "#361d24", "#704228", "#c5a059"]
            },
            {
                name: "王立学院の古典書庫",
                url: "https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?auto=format&fit=crop&w=1920&q=80",
                palette: ["#141219", "#292236", "#5e432c", "#e0be75"]
            },
            {
                name: "重厚なオーク材の書棚",
                url: "https://images.unsplash.com/photo-1529148482759-b35b25c5f217?auto=format&fit=crop&w=1920&q=80",
                palette: ["#18110d", "#382419", "#784c2a", "#d4af37"]
            },
            {
                name: "月光差すゴシック図書室",
                url: "https://images.unsplash.com/photo-1535905557558-afc4877a26fc?auto=format&fit=crop&w=1920&q=80",
                palette: ["#0e111a", "#1e2538", "#4f3a28", "#c5a059"]
            },
            {
                name: "錬金術師の私設書斎",
                url: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=1920&q=80",
                palette: ["#171210", "#33231c", "#6e472b", "#f3e5ab"]
            },
            {
                name: "古地図と革装丁の書架",
                url: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=1920&q=80",
                palette: ["#151012", "#2e1f24", "#664529", "#d4af37"]
            }
        ];

        let lastBgIndex = -1;

        // Generate an intricate Dark Academia SVG library fallback in case an image is slow/blocked
        function createLibraryFallbackSvg(palette) {
            const [bgDark, shelfWood, bookTone, goldAccent] = palette;
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
                    <defs>
                        <radialGradient id="glow" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="${goldAccent}" stop-opacity="0.22"/>
                            <stop offset="100%" stop-color="${bgDark}" stop-opacity="0.95"/>
                        </radialGradient>
                    </defs>
                    <rect width="800" height="600" fill="${bgDark}"/>
                    <!-- Arched Gothic Windows & Shelves -->
                    <g opacity="0.55">
                        <rect x="40" y="30" width="210" height="540" rx="100" fill="${shelfWood}" stroke="${goldAccent}" stroke-width="2"/>
                        <rect x="295" y="15" width="210" height="570" rx="100" fill="${shelfWood}" stroke="${goldAccent}" stroke-width="2"/>
                        <rect x="550" y="30" width="210" height="540" rx="100" fill="${shelfWood}" stroke="${goldAccent}" stroke-width="2"/>
                        <!-- Bookshelves horizontal bars & book spines -->
                        <line x1="40" y1="160" x2="760" y2="160" stroke="${goldAccent}" stroke-width="3"/>
                        <line x1="40" y1="280" x2="760" y2="280" stroke="${goldAccent}" stroke-width="3"/>
                        <line x1="40" y1="400" x2="760" y2="400" stroke="${goldAccent}" stroke-width="3"/>
                        <line x1="40" y1="510" x2="760" y2="510" stroke="${goldAccent}" stroke-width="3"/>
                        <rect x="75" y="105" width="18" height="55" fill="${bookTone}"/>
                        <rect x="98" y="98" width="22" height="62" fill="${bgDark}" stroke="${goldAccent}" stroke-width="1"/>
                        <rect x="125" y="110" width="16" height="50" fill="${bookTone}"/>
                        <rect x="330" y="215" width="24" height="65" fill="${bookTone}"/>
                        <rect x="360" y="225" width="18" height="55" fill="${bgDark}" stroke="${goldAccent}" stroke-width="1"/>
                        <rect x="385" y="210" width="20" height="70" fill="${bookTone}"/>
                        <rect x="590" y="335" width="22" height="65" fill="${bookTone}"/>
                        <rect x="618" y="345" width="16" height="55" fill="${bgDark}" stroke="${goldAccent}" stroke-width="1"/>
                        <rect x="640" y="330" width="24" height="70" fill="${bookTone}"/>
                    </g>
                    <rect width="800" height="600" fill="url(#glow)"/>
                </svg>
            `;
            return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
        }

        // Pick a random library background (different from previous page) on every page transition
        function changeRandomLibraryBackground() {
            const bgLayer = document.getElementById('library-bg-layer');
            const badge = document.getElementById('bg-scene-badge');
            if (!bgLayer) return;

            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * darkAcademiaLibraryScenes.length);
            } while (nextIndex === lastBgIndex && darkAcademiaLibraryScenes.length > 1);

            lastBgIndex = nextIndex;
            const scene = darkAcademiaLibraryScenes[nextIndex];
            const fallbackUrl = createLibraryFallbackSvg(scene.palette);

            // Set procedural library fallback immediately so it never flashes blank, then layer photo
            bgLayer.style.backgroundImage = `url('${scene.url}'), ${fallbackUrl}`;

            if (badge) {
                badge.innerText = `🏛️ ${scene.name} (${nextIndex + 1}/10)`;
            }
        }

        // Complete Quiz Datasets (1st Exam: 30 Questions, 2nd Exam: 45 Questions)
        const quizDatasets = [
            {
                id: "exam1_30",
                group: "practice_set_1_2",
                title: "第1回 3次元CAD利用技術者試験（全30問）",
                description: "製品開発の基本概念、モデリング手法（押し出し・ロフト・スイープ）、ソリッド表現（B-reps・CSG）、PDM/BOM、ネットワーク・セキュリティ、CAE/CAM/DMUまで全30問を完全収録。",
                questions: [
                    {
                        question: "3次元CADで部品や図面などに付加される、材質・名称・管理情報などの情報を何というか。",
                        options: ["属性", "フィーチャ", "メッシュ", "レイヤー"],
                        correctAnswer: "属性",
                        explanation: "【属性】部品や図面などの形状データに付随する、材質・部品番号・作成者などの管理情報やメタデータを「属性（アトリビュート）」と呼びます。（フィーチャは穴や溝などの形状要素、メッシュは解析用の要素分割、レイヤーは表示管理の層です）",
                        point: "形状以外の付加情報（材質・部品番号・作成者など）＝属性。"
                    },
                    {
                        question: "製品開発の複数の工程を並行して進め、開発期間の短縮を図る考え方として最も適切なものはどれか。",
                        options: ["リバースエンジニアリング", "コンカレント・エンジニアリング", "ラピッドプロトタイピング", "シーケンシャル・エンジニアリング"],
                        correctAnswer: "コンカレント・エンジニアリング",
                        explanation: "【コンカレント・エンジニアリング】設計・解析・生産技術・購買などの複数工程を同時並行で進め、開発期間の短縮と手戻り防止を図る手法です。（シーケンシャルは直列・順番に進める従来手法、リバースエンジニアリングは実物からのデータ復元、ラピッドプロトタイピングは高速試作です）",
                        point: "複数工程を同時並行して期間短縮＝コンカレント・エンジニアリング。"
                    },
                    {
                        question: "3次元CADで、製品を構成する個々の部品形状を作成するためのモデルとして最も適切なものはどれか。",
                        options: ["パーツモデル", "アセンブリモデル", "ネットリスト", "BOM"],
                        correctAnswer: "パーツモデル",
                        explanation: "【パーツモデル】製品を構成する単一の部品（ボルト1本、カバー1つなど）を表現した3次元モデルです。（アセンブリモデルは複数部品の組立体、ネットリストは電子回路の接続情報、BOMは部品表です）",
                        point: "単一の部品モデル＝パーツモデル。"
                    },
                    {
                        question: "複数の部品を組み合わせて、製品全体の構成や部品間の位置関係を表現するモデルはどれか。",
                        options: ["サーフェスモデル", "パーツモデル", "アセンブリモデル", "ワイヤーフレームモデル"],
                        correctAnswer: "アセンブリモデル",
                        explanation: "【アセンブリモデル】複数のパーツモデルを組み合わせ、拘束条件によって位置関係を定義した製品全体の組立モデルです。",
                        point: "複数部品を組み合わせた組立モデル＝アセンブリモデル。"
                    },
                    {
                        question: "断面となる2次元形状を、直線方向に移動させて立体を作成する代表的なモデリング操作はどれか。",

        // Application State
        let currentDataset = null;

            toastMsg.innerText = msg;
            toast.classList.remove('hidden');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function startQuiz(datasetId) {
            currentDataset = quizDatasets.find(d => d.id === datasetId);
            if (!currentDataset) return;

            currentIndex = 0;
            userAnswers = new Array(currentDataset.questions.length).fill(null);
            isAnswered = false;

            changeRandomLibraryBackground();
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            document.getElementById('home-btn-header').classList.remove('hidden');

            document.getElementById('quiz-file-title').innerText = currentDataset.title;
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadQuestion() {
            const total = currentDataset.questions.length;
            const q = currentDataset.questions[currentIndex];
            const savedAnswer = userAnswers[currentIndex];
            isAnswered = (savedAnswer !== null);

            document.getElementById('quiz-progress-text').innerText = `第 ${currentIndex + 1} 問 / 全 ${total} 問`;
            document.getElementById('current-q-badge').innerHTML = `<span>❖ 問題 ${currentIndex + 1}</span>`;
            document.getElementById('question-text').innerText = q.question;

            const diagramContainer = document.getElementById('question-diagram-container');
            if (q.diagram) {
                diagramContainer.innerHTML = q.diagram;
                diagramContainer.classList.remove('hidden');
            } else {
                diagramContainer.innerHTML = '';
                diagramContainer.classList.add('hidden');
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            if (q.type === 'multi_fill') {
                const wrapper = document.createElement('div');
                wrapper.className = 'space-y-3';

                const inputs = [];
                q.blanks.forEach((blank, bIdx) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-3';

                    const badge = document.createElement('span');
                    badge.className = 'w-9 h-9 rounded-lg bg-[#261829] border border-[#c5a059]/60 text-[#f3e5ab] font-bold flex items-center justify-center shrink-0 text-sm';
                    badge.innerText = blank.label;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = blank.placeholder || `${blank.label}に入る用語を入力`;
                    input.autocomplete = 'off';
                    input.className = 'flex-grow px-4 py-3 rounded-xl bg-[#120e16] border border-[#c5a059]/60 text-[#f5efe6] placeholder-[#7d7267] focus:outline-none focus:border-[#ffd700] focus:ring-2 focus:ring-[#d4af37]/30 text-base font-bold tracking-wide';

                    if (isAnswered && Array.isArray(savedAnswer)) {
                        const userVal = savedAnswer[bIdx] || '';
                        input.value = userVal;
                        input.disabled = true;
                        const blankOk = isSingleBlankCorrect(userVal, blank);
                        input.className += blankOk
                            ? ' border-2 border-emerald-500 bg-emerald-950/50 text-emerald-200'
                            : ' border-2 border-rose-500 bg-rose-950/50 text-rose-200';
                    }

                    inputs.push(input);
                    row.appendChild(badge);
                    row.appendChild(input);
                    wrapper.appendChild(row);
                });

                if (!isAnswered) {
                    const submitBtn = document.createElement('button');
                    submitBtn.type = 'button';
                    submitBtn.className = 'antique-btn w-full sm:w-auto px-7 py-3.5 rounded-xl font-bold text-sm sm:text-base mt-2';
                    submitBtn.innerText = '✦ 解答する';

                    const handleMultiSubmit = () => {
                        const vals = inputs.map(inp => inp.value.trim());
                        const emptyIdx = vals.findIndex(v => !v);
                        if (emptyIdx !== -1) {
                            showMessage(`${q.blanks[emptyIdx].label} の空欄に用語を入力してください。`);
                            inputs[emptyIdx].focus();
                            return;
                        }
                        selectOption(vals);
                    };

                    submitBtn.onclick = handleMultiSubmit;
                    inputs.forEach((inp, idx) => {
                        inp.onkeydown = (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                if (idx < inputs.length - 1) {
                                    inputs[idx + 1].focus();
                                } else {
                                    handleMultiSubmit();
                                }
                            }
                        };
                    });

                    wrapper.appendChild(submitBtn);
                    setTimeout(() => inputs[0] && inputs[0].focus(), 50);
                }

                optionsContainer.appendChild(wrapper);
            } else if (q.type === 'fill') {
                const wrapper = document.createElement('div');
                wrapper.className = 'space-y-4';

                const inputRow = document.createElement('div');
                inputRow.className = 'flex flex-col sm:flex-row gap-3';

                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'fill-answer-input';
                input.placeholder = q.placeholder || '用語を入力してください';
                input.autocomplete = 'off';
                input.className = 'flex-grow px-4 py-3.5 rounded-xl bg-[#120e16] border border-[#c5a059]/60 text-[#f5efe6] placeholder-[#7d7267] focus:outline-none focus:border-[#ffd700] focus:ring-2 focus:ring-[#d4af37]/30 text-base sm:text-lg font-bold tracking-wide';

                const submitBtn = document.createElement('button');
                submitBtn.type = 'button';
                submitBtn.className = 'antique-btn px-6 py-3.5 rounded-xl font-bold text-sm sm:text-base whitespace-nowrap shrink-0';
                submitBtn.innerText = '✦ 解答する';

                if (isAnswered) {
                    input.value = savedAnswer;
                    input.disabled = true;
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    const correct = isQuestionCorrect(savedAnswer, q);
                    input.className += correct
                        ? ' border-2 border-emerald-500 bg-emerald-950/50 text-emerald-200'
                        : ' border-2 border-rose-500 bg-rose-950/50 text-rose-200';
                } else {
                    const handleFillSubmit = () => {
                        const val = input.value.trim();
                        if (!val) {
                            showMessage('空欄に用語を入力してください。');
                            input.focus();
                            return;
                        }
                        selectOption(val);
                    };
                    submitBtn.onclick = handleFillSubmit;
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            handleFillSubmit();
                        }
                    };
                }

                inputRow.appendChild(input);
                inputRow.appendChild(submitBtn);
                wrapper.appendChild(inputRow);

                optionsContainer.appendChild(wrapper);
                if (!isAnswered) {
                    setTimeout(() => input.focus(), 50);
                }
            } else {
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'antique-option w-full text-left p-4 rounded-xl font-medium flex items-center justify-between transition';
                    
                    let iconText = String.fromCharCode(9312 + idx); // ①, ②, ③, ④
                    btn.innerHTML = `
                        <span class="flex items-start space-x-3">
                            <span class="font-bold text-[#d4af37] text-lg leading-snug">${iconText}</span>
                            <span class="leading-snug">${opt}</span>
                        </span>
                    `;

                    if (isAnswered) {
                        btn.disabled = true;
                        if (opt === q.correctAnswer) {
                            btn.className = 'w-full text-left p-4 rounded-xl font-bold flex items-center justify-between border-2 border-emerald-500/80 bg-emerald-950/70 text-emerald-200 shadow-[0_0_15px_rgba(16,185,129,0.25)]';
                            btn.innerHTML += `<span class="text-xs px-2 py-0.5 rounded bg-emerald-800/80 text-emerald-100 ml-2 shrink-0">正解</span>`;
                        } else if (savedAnswer === opt && opt !== q.correctAnswer) {
                            btn.className = 'w-full text-left p-4 rounded-xl font-bold flex items-center justify-between border-2 border-rose-500/80 bg-rose-950/70 text-rose-200 shadow-[0_0_15px_rgba(244,63,94,0.25)]';
                            btn.innerHTML += `<span class="text-xs px-2 py-0.5 rounded bg-rose-800/80 text-rose-100 ml-2 shrink-0">あなたの選択</span>`;
                        } else {
                            btn.className += ' opacity-45';
                        }
                    } else {
                        btn.onclick = () => selectOption(opt);
                    }

                    optionsContainer.appendChild(btn);
                });
            }

            // Handle explanation box
            const expBox = document.getElementById('explanation-box');
            if (isAnswered) {
                showExplanationUI(savedAnswer, q);
            } else {
                expBox.classList.add('hidden');
            }

            // Update Navigation Buttons
            const prevBtn = document.getElementById('prev-btn');
            prevBtn.disabled = (currentIndex === 0);
            prevBtn.style.opacity = (currentIndex === 0) ? '0.4' : '1';
            prevBtn.style.cursor = (currentIndex === 0) ? 'not-allowed' : 'pointer';

            const nextBtnText = document.getElementById('next-btn-text');
            if (currentIndex === total - 1) {
                nextBtnText.innerText = '✦ 最終結果へ ✦';
            } else {
                nextBtnText.innerText = '次へ ▶';
            }
        }

        function normalizeAnswer(str) {
            return String(str || '')
                .trim()
                .replace(/[Ａ-Ｚａ-ｚ０-９－]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/[‐‑‒–—―ー]/g, '-')
                .replace(/\s+/g, '')
                .toLowerCase();
        }

        function isSingleBlankCorrect(userVal, blank) {
            const normUser = normalizeAnswer(userVal);
            const list = blank.acceptedAnswers || [blank.correctAnswer];
            return list.some(ans => normalizeAnswer(ans) === normUser);
        }

        function isQuestionCorrect(userAns, q) {
            if (userAns === null || userAns === undefined) return false;
            if (q.type === 'multi_fill') {
                if (!Array.isArray(userAns)) return false;
                return q.blanks.every((blank, idx) => isSingleBlankCorrect(userAns[idx], blank));
            }
            if (q.type === 'fill') {
                const normUser = normalizeAnswer(userAns);
                const list = q.acceptedAnswers || [q.correctAnswer];
                return list.some(ans => normalizeAnswer(ans) === normUser);
            }
            return userAns === q.correctAnswer;
        }

        function selectOption(selectedOpt) {
            if (isAnswered) return;

            userAnswers[currentIndex] = selectedOpt;
            isAnswered = true;
            loadQuestion();
        }

        function showExplanationUI(selectedOpt, q) {
            const expBox = document.getElementById('explanation-box');
            const expHeader = document.getElementById('explanation-header');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden');
            const isCorrect = isQuestionCorrect(selectedOpt, q);
            const displayCorrectAnswer = q.type === 'multi_fill'
                ? q.blanks.map(b => `${b.label}：${b.correctAnswer}`).join(' ／ ')
                : q.correctAnswer;

            if (isCorrect) {
                expBox.className = 'mt-6 p-5 rounded-xl border-l-4 border-emerald-500 bg-[#0f241d] text-emerald-100 shadow-inner animate-fadeIn';
                expHeader.innerHTML = `
                    <svg class="w-6 h-6 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-lg text-emerald-300">見事、正解です！（正解：<strong class="text-[#f3e5ab]">${displayCorrectAnswer}</strong>）</span>
                `;
            } else {
                expBox.className = 'mt-6 p-5 rounded-xl border-l-4 border-rose-500 bg-[#261117] text-rose-100 shadow-inner animate-fadeIn';
                expHeader.innerHTML = `
                    <svg class="w-6 h-6 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-lg text-rose-300">惜しくも不正解（正解：<strong class="underline text-[#f3e5ab]">${displayCorrectAnswer}</strong>）</span>
                `;
            }

            const pointHtml = q.point
                ? `<div class="mt-3 p-3.5 rounded-lg bg-[#1a141e]/90 border border-[#c5a059]/50 text-[#f3e5ab]">
                        <span class="text-xs tracking-wider text-[#ffd700] font-bold block mb-1">💡 覚えるポイント</span>
                        <span class="font-semibold">${q.point}</span>
                   </div>`
                : '';

            expText.innerHTML = `
                <div class="mt-2 pt-2 border-t border-white/10 text-[#e6dfd3]">
                    <span class="text-xs uppercase tracking-wider text-[#d4af37] font-bold block mb-1">✦ 解説</span>
                    <p>${q.explanation}</p>
                    ${pointHtml}
                </div>
            `;
        }

        function nextQuestion() {
            const total = currentDataset.questions.length;
            if (!isAnswered && userAnswers[currentIndex] === null) {
                showMessage(currentDataset.questions[currentIndex].type === 'fill'
                    ? '空欄に用語を入力して「解答する」を押してください。'
                    : 'いずれかの選択肢を1つお選びください。');
                return;
            }

            if (currentIndex < total - 1) {
                currentIndex++;
                changeRandomLibraryBackground();
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                changeRandomLibraryBackground();
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function showResult() {
            changeRandomLibraryBackground();
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');

            let correctCount = 0;
            let incorrectCount = 0;
            const total = currentDataset.questions.length;

            currentDataset.questions.forEach((q, idx) => {
                if (isQuestionCorrect(userAnswers[idx], q)) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            });

            const percentage = Math.round((correctCount / total) * 100);

            document.getElementById('result-file-subtitle').innerText = `対象試験： ${currentDataset.title}`;
            document.getElementById('stat-correct').innerText = `${correctCount} 回`;
            document.getElementById('stat-incorrect').innerText = `${incorrectCount} 回`;
            document.getElementById('stat-percentage').innerText = `${percentage}%`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function retryQuiz() {
            if (currentDataset) {
                startQuiz(currentDataset.id);
            }
        }

        function goToHome() {
            renderHomeView(null);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
